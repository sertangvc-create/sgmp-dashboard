<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SGMP Kontrol Paneli</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 22px;
      background: #070707;
      color: #f4f4f4;
      font-family: Arial, Helvetica, sans-serif;
    }

    h1 {
      font-size: 42px;
      margin: 0 0 8px;
      letter-spacing: -1px;
    }

    .subtitle {
      color: #9a9a9a;
      font-size: 18px;
      margin-bottom: 28px;
    }

    .status {
      margin: 18px 0;
      color: #aaa;
      font-size: 15px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 14px;
      margin-bottom: 28px;
    }

    .card {
      background: #121212;
      border: 1px solid #262626;
      border-radius: 16px;
      padding: 16px;
    }

    .label {
      color: #9a9a9a;
      font-size: 12px;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .metric {
      font-size: 32px;
      font-weight: 800;
      margin-top: 8px;
    }

    h2 {
      font-size: 28px;
      margin: 34px 0 14px;
    }

    .project {
      background: #121212;
      border: 1px solid #262626;
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 14px;
    }

    .top {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
      flex-wrap: wrap;
    }

    .title {
      font-size: 22px;
      font-weight: 800;
    }

    .meta {
      color: #8d8d8d;
      margin-top: 6px;
      font-size: 14px;
    }

    .badge {
      background: #202020;
      border: 1px solid #363636;
      color: #ddd;
      border-radius: 999px;
      padding: 7px 12px;
      font-size: 12px;
      white-space: nowrap;
    }

    .row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
      gap: 10px;
      margin-top: 16px;
    }

    .mini {
      background: #181818;
      border-radius: 13px;
      padding: 12px;
    }

    .mini strong {
      display: block;
      font-size: 24px;
    }

    .mini span {
      display: block;
      color: #888;
      font-size: 12px;
      margin-top: 4px;
    }

    .prompt {
      background: #121212;
      border: 1px solid #262626;
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 16px;
    }

    textarea {
      width: 100%;
      min-height: 220px;
      margin-top: 12px;
      background: #0c0c0c;
      color: #e6e6e6;
      border: 1px solid #2d2d2d;
      border-radius: 14px;
      padding: 14px;
      font-size: 14px;
      line-height: 1.5;
    }

    .smallbox {
      margin-top: 10px;
      color: #bbb;
      background: #171717;
      border-radius: 12px;
      padding: 12px;
      line-height: 1.5;
    }

    .qc-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 14px;
    }

    .qc {
      background: #121212;
      border: 1px solid #262626;
      border-radius: 18px;
      padding: 18px;
    }

    .score {
      font-size: 44px;
      font-weight: 900;
      margin: 12px 0;
    }

    .good { color: #55d68f; }
    .bad { color: #ff7474; }
    .warn { color: #f3c969; }

    .decision {
      color: #aaa;
      font-size: 13px;
      line-height: 1.45;
      margin-top: 10px;
    }

    .error {
      color: #ff7474;
      background: #1c0f0f;
      border: 1px solid #582626;
      padding: 14px;
      border-radius: 14px;
      margin-top: 18px;
      white-space: pre-wrap;
    }

    button {
      background: #f4f4f4;
      color: #070707;
      border: none;
      border-radius: 12px;
      padding: 11px 16px;
      font-weight: 800;
      margin-bottom: 20px;
    }
  </style>
</head>

<body>
  <h1>SGMP Kontrol Paneli</h1>
  <div class="subtitle">Yapay zekâya özgü müzik işletim sistemi çalışma zamanı</div>

  <button onclick="loadDashboard()">Yenile</button>
  <div id="status" class="status">Veri yükleniyor...</div>

  <div id="summary" class="grid"></div>

  <h2>Projeler</h2>
  <div id="projects"></div>

  <h2>İstem Çıktıları</h2>
  <div id="prompts"></div>

  <h2>Kalite Kontrol Sonuçları</h2>
  <div id="qc" class="qc-grid"></div>

  <script>
    const SUPABASE_URL = "https://udrqfnkkhtektstlbfva.supabase.co";
    const SUPABASE_KEY = "sb_publishable_cT9Rj7hwTJy5rrtmLT-DzA_fy7NCeGk";

    const statusEl = document.getElementById("status");

    async function loadDashboard() {
      statusEl.textContent = "Veri yükleniyor...";

      try {
        const response = await fetch(
          `${SUPABASE_URL}/rest/v1/rpc/get_sgmp_dashboard_data`,
          {
            method: "POST",
            headers: {
              "apikey": SUPABASE_KEY,
              "Authorization": `Bearer ${SUPABASE_KEY}`,
              "Content-Type": "application/json"
            },
            body: "{}"
          }
        );

        const text = await response.text();

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}\n${text}`);
        }

        const data = JSON.parse(text);

        renderSummary(data.summary || {});
        renderProjects(data.projects || []);
        renderPrompts((data.prompts || []).filter(p => p.master_prompt));
        renderQC(data.qc || []);

        statusEl.textContent = "Veri başarıyla yüklendi.";
      } catch (err) {
        statusEl.innerHTML = `<div class="error">HATA: ${err.message}</div>`;
      }
    }

    function renderSummary(summary) {
      const metrics = [
        ["Toplam Proje", summary.total_projects || 0],
        ["Ready", summary.ready_requests || 0],
        ["Completed", summary.completed_requests || 0],
        ["Failed", summary.failed_requests || 0],
        ["Prompt", summary.prompt_outputs || 0],
        ["QC", summary.qc_outputs || 0]
      ];

      document.getElementById("summary").innerHTML = metrics.map(([label, value]) => `
        <div class="card">
          <div class="label">${label}</div>
          <div class="metric">${value}</div>
        </div>
      `).join("");
    }

    function renderProjects(projects) {
      document.getElementById("projects").innerHTML = projects.map(p => `
        <div class="project">
          <div class="top">
            <div>
              <div class="title">${escapeHtml(p.working_title || "-")}</div>
              <div class="meta">${escapeHtml(p.project_code || "-")} · ${escapeHtml(p.character_name || "-")}</div>
            </div>
            <div class="badge">${escapeHtml(p.pipeline_stage || "-")}</div>
          </div>

          <div class="row">
            <div class="mini"><strong>${p.completed_requests || 0}</strong><span>Completed</span></div>
            <div class="mini"><strong>${p.ready_requests || 0}</strong><span>Ready</span></div>
            <div class="mini"><strong>${p.execution_job_count || 0}</strong><span>Jobs</span></div>
            <div class="mini"><strong>${p.queue_count || 0}</strong><span>Queue</span></div>
          </div>
        </div>
      `).join("");
    }

    function renderPrompts(prompts) {
      if (!prompts.length) {
        document.getElementById("prompts").innerHTML = `<div class="status">Henüz prompt çıktısı yok.</div>`;
        return;
      }

      document.getElementById("prompts").innerHTML = prompts.map(p => `
        <div class="prompt">
          <div class="title">${escapeHtml(p.working_title || "-")}</div>
          <div class="meta">${escapeHtml(p.project_code || "-")}</div>

          <textarea readonly>${escapeHtml(p.master_prompt || "")}</textarea>

          <div class="smallbox"><b>Style Prompt:</b><br>${escapeHtml(p.style_prompt_200 || "-")}</div>
          <div class="smallbox"><b>Vocal Lock:</b><br>${escapeHtml(p.vocal_lock || "-")}</div>
          <div class="smallbox"><b>Anti Loop:</b><br>${escapeHtml(p.anti_loop_strategy || "-")}</div>
        </div>
      `).join("");
    }

    function renderQC(qcItems) {
      if (!qcItems.length) {
        document.getElementById("qc").innerHTML = `<div class="status">Henüz QC sonucu yok.</div>`;
        return;
      }

      document.getElementById("qc").innerHTML = qcItems.map(q => {
        const scoreClass = q.release_ready ? "good" : "bad";

        return `
          <div class="qc">
            <div class="title">${escapeHtml(q.working_title || "-")}</div>
            <div class="meta">${escapeHtml(q.project_code || "-")}</div>

            <div class="score ${scoreClass}">${q.replay_value_score || 0}</div>

            <div class="smallbox">Groove: ${q.groove_integrity_score || 0}</div>
            <div class="smallbox">Cinematic: ${q.cinematic_realism_score || 0}</div>
            <div class="smallbox">Character: ${q.character_consistency_score || 0}</div>

            <div class="decision">${escapeHtml(q.final_decision || "-")}</div>
          </div>
        `;
      }).join("");
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    loadDashboard();
  </script>
</body>
</html>
