<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SGMP Dashboard</title>

  <style>
    body{
      background:#0a0a0a;
      color:#f5f5f5;
      font-family:Arial,sans-serif;
      padding:20px;
    }

    h1{
      font-size:48px;
      margin-bottom:10px;
    }

    .subtitle{
      color:#999;
      margin-bottom:30px;
    }

    .status{
      margin-bottom:20px;
      color:#bbb;
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
      gap:15px;
      margin-bottom:40px;
    }

    .card{
      background:#141414;
      border:1px solid #2a2a2a;
      border-radius:16px;
      padding:18px;
    }

    .label{
      color:#888;
      font-size:12px;
      text-transform:uppercase;
    }

    .metric{
      font-size:38px;
      font-weight:bold;
      margin-top:8px;
    }

    .project{
      background:#141414;
      border:1px solid #2a2a2a;
      border-radius:16px;
      padding:18px;
      margin-bottom:15px;
    }

    .title{
      font-size:24px;
      font-weight:bold;
    }

    .meta{
      color:#888;
      margin-top:6px;
      margin-bottom:12px;
    }

    .badge{
      display:inline-block;
      background:#222;
      padding:6px 12px;
      border-radius:999px;
      font-size:12px;
      margin-bottom:14px;
    }

    .row{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(100px,1fr));
      gap:10px;
    }

    .mini{
      background:#1c1c1c;
      border-radius:12px;
      padding:10px;
    }

    .mini strong{
      font-size:24px;
      display:block;
    }

    .mini span{
      color:#888;
      font-size:12px;
    }

    textarea{
      width:100%;
      min-height:220px;
      margin-top:14px;
      background:#0b0b0b;
      color:#eee;
      border:1px solid #333;
      border-radius:12px;
      padding:14px;
    }

    .qc{
      background:#141414;
      border:1px solid #2a2a2a;
      border-radius:16px;
      padding:18px;
      margin-bottom:15px;
    }

    .score{
      font-size:54px;
      font-weight:bold;
      margin:15px 0;
    }

    .good{
      color:#4ddb8d;
    }

    .bad{
      color:#ff7b7b;
    }

    h2{
      margin:40px 0 20px;
    }
  </style>
</head>

<body>

<h1>SGMP Dashboard</h1>

<div class="subtitle">
AI-native music operating system
</div>

<div id="status" class="status">
Loading...
</div>

<div id="summary" class="grid"></div>

<h2>Projects</h2>
<div id="projects"></div>

<h2>Prompt Outputs</h2>
<div id="prompts"></div>

<h2>QC Results</h2>
<div id="qc"></div>

<script>

const FUNCTION_URL =
"https://udrqfnkkhtetkstlbfva.supabase.co/functions/v1/swift-api";
  
async function loadDashboard(){

  const status = document.getElementById("status");

  try{

    status.innerHTML = "Loading dashboard...";

    const response = await fetch(
      FUNCTION_URL,
      {
        method:"POST",
        headers:{
          "Content-Type":"application/json"
        }
      }
    );

    const result = await response.json();

    if(!result.ok){
      throw new Error(result.error || "Unknown error");
    }

    const data = result.data;

    renderSummary(data.summary);
    renderProjects(data.projects);
    renderPrompts(data.prompts);
    renderQC(data.qc);

    status.innerHTML = "Dashboard loaded.";

  }catch(err){

    status.innerHTML =
      "ERROR: " + err.message;

  }

}

function renderSummary(summary){

  const metrics = [
    ["Projects", summary.total_projects],
    ["Ready", summary.ready_requests],
    ["Completed", summary.completed_requests],
    ["Prompt", summary.prompt_outputs],
    ["QC", summary.qc_outputs],
    ["Failed", summary.failed_requests]
  ];

  document.getElementById("summary").innerHTML =
    metrics.map(m => `
      <div class="card">
        <div class="label">${m[0]}</div>
        <div class="metric">${m[1]}</div>
      </div>
    `).join("");

}

function renderProjects(projects){

  document.getElementById("projects").innerHTML =
    projects.map(p => `
      <div class="project">

        <div class="title">
          ${p.working_title}
        </div>

        <div class="meta">
          ${p.project_code} · ${p.character_name}
        </div>

        <div class="badge">
          ${p.pipeline_stage}
        </div>

        <div class="row">

          <div class="mini">
            <strong>${p.completed_requests}</strong>
            <span>Completed</span>
          </div>

          <div class="mini">
            <strong>${p.ready_requests}</strong>
            <span>Ready</span>
          </div>

          <div class="mini">
            <strong>${p.execution_job_count}</strong>
            <span>Jobs</span>
          </div>

          <div class="mini">
            <strong>${p.queue_count}</strong>
            <span>Queue</span>
          </div>

        </div>

      </div>
    `).join("");

}

function renderPrompts(prompts){

  document.getElementById("prompts").innerHTML =
    prompts
      .filter(p => p.master_prompt)
      .map(p => `
        <div class="project">

          <div class="title">
            ${p.working_title}
          </div>

          <div class="meta">
            ${p.project_code}
          </div>

          <textarea readonly>${p.master_prompt}</textarea>

        </div>
      `).join("");

}

function renderQC(qcItems){

  document.getElementById("qc").innerHTML =
    qcItems.map(q => `
      <div class="qc">

        <div class="title">
          ${q.working_title}
        </div>

        <div class="meta">
          ${q.project_code}
        </div>

        <div class="score ${q.release_ready ? "good" : "bad"}">
          ${q.replay_value_score}
        </div>

        <div>
          Groove: ${q.groove_integrity_score}
        </div>

        <div>
          Cinematic: ${q.cinematic_realism_score}
        </div>

        <div>
          Character: ${q.character_consistency_score}
        </div>

      </div>
    `).join("");

}

loadDashboard();

</script>

</body>
</html>
