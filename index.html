<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SGMP Dashboard</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      background:#090909;
      color:#f5f5f5;
      font-family:Inter,Arial,sans-serif;
      padding:24px;
    }

    h1{
      font-size:34px;
      margin-bottom:6px;
      letter-spacing:-1px;
    }

    .sub{
      color:#999;
      margin-bottom:32px;
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
      gap:18px;
      margin-bottom:28px;
    }

    .card{
      background:#121212;
      border:1px solid #232323;
      border-radius:18px;
      padding:18px;
    }

    .metric{
      font-size:34px;
      font-weight:700;
      margin-top:10px;
    }

    .label{
      color:#888;
      font-size:13px;
      text-transform:uppercase;
      letter-spacing:1px;
    }

    .section{
      margin-top:38px;
    }

    .section h2{
      margin-bottom:18px;
      font-size:24px;
    }

    .project{
      background:#121212;
      border:1px solid #232323;
      border-radius:18px;
      padding:20px;
      margin-bottom:16px;
    }

    .project-top{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:10px;
      flex-wrap:wrap;
      gap:12px;
    }

    .project-title{
      font-size:22px;
      font-weight:700;
    }

    .badge{
      background:#1e1e1e;
      border:1px solid #333;
      padding:6px 10px;
      border-radius:999px;
      font-size:12px;
      color:#ccc;
    }

    .row{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      margin-top:14px;
    }

    .mini{
      background:#181818;
      border-radius:12px;
      padding:10px 14px;
      min-width:120px;
    }

    .mini .value{
      font-size:22px;
      font-weight:700;
    }

    .mini .name{
      color:#888;
      font-size:12px;
      margin-top:4px;
    }

    .prompt-box{
      background:#121212;
      border:1px solid #232323;
      border-radius:18px;
      padding:20px;
      margin-bottom:18px;
    }

    textarea{
      width:100%;
      min-height:180px;
      background:#0f0f0f;
      color:#ddd;
      border:1px solid #2a2a2a;
      border-radius:12px;
      padding:14px;
      margin-top:14px;
      resize:vertical;
    }

    .qc{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
      gap:14px;
    }

    .score{
      background:#121212;
      border:1px solid #232323;
      border-radius:18px;
      padding:20px;
    }

    .score-title{
      color:#aaa;
      margin-bottom:10px;
    }

    .score-value{
      font-size:42px;
      font-weight:700;
    }

    .approved{
      color:#55d68f;
    }

    .rejected{
      color:#ff7474;
    }

    .loading{
      color:#888;
      margin-top:30px;
    }
  </style>
</head>
<body>

  <h1>SGMP Dashboard</h1>
  <div class="sub">
    AI-native music operating system runtime
  </div>

  <div id="summary" class="grid"></div>

  <div class="section">
    <h2>Projects</h2>
    <div id="projects"></div>
  </div>

  <div class="section">
    <h2>Prompt Outputs</h2>
    <div id="prompts"></div>
  </div>

  <div class="section">
    <h2>QC Results</h2>
    <div id="qc" class="qc"></div>
  </div>

  <script>

    const SUPABASE_URL =
      "https://udrqfnkkhtektstlbfva.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_cT9Rj7hwTJy5rrtmLT-DzA_fy7NCeGk";

    const client = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    async function loadDashboard(){

      const { data, error } = await client.rpc(
        "get_sgmp_dashboard_data"
      );

      if(error){
        document.body.innerHTML += `
          <div class="loading">
            ERROR: ${error.message}
          </div>
        `;
        return;
      }

      renderSummary(data.summary);
      renderProjects(data.projects);
      renderPrompts(data.prompts);
      renderQC(data.qc);
    }

    function renderSummary(summary){

      const el = document.getElementById("summary");

      const metrics = [
        ["Projects", summary.total_projects],
        ["Completed", summary.completed_requests],
        ["Ready", summary.ready_requests],
        ["Failed", summary.failed_requests],
        ["Prompt Outputs", summary.prompt_outputs],
        ["QC Outputs", summary.qc_outputs]
      ];

      el.innerHTML = metrics.map(m => `
        <div class="card">
          <div class="label">${m[0]}</div>
          <div class="metric">${m[1]}</div>
        </div>
      `).join("");
    }

    function renderProjects(projects){

      const el = document.getElementById("projects");

      el.innerHTML = projects.map(p => `
        <div class="project">

          <div class="project-top">
            <div>
              <div class="project-title">
                ${p.working_title}
              </div>

              <div style="margin-top:6px;color:#888;">
                ${p.project_code} · ${p.character_name}
              </div>
            </div>

            <div class="badge">
              ${p.pipeline_stage}
            </div>
          </div>

          <div class="row">

            <div class="mini">
              <div class="value">
                ${p.completed_requests}
              </div>
              <div class="name">
                Completed
              </div>
            </div>

            <div class="mini">
              <div class="value">
                ${p.ready_requests}
              </div>
              <div class="name">
                Ready
              </div>
            </div>

            <div class="mini">
              <div class="value">
                ${p.execution_job_count}
              </div>
              <div class="name">
                Jobs
              </div>
            </div>

            <div class="mini">
              <div class="value">
                ${p.queue_count}
              </div>
              <div class="name">
                Queue
              </div>
            </div>

          </div>

        </div>
      `).join("");
    }

    function renderPrompts(prompts){

      const el = document.getElementById("prompts");

      el.innerHTML = prompts.map(p => `
        <div class="prompt-box">

          <div style="font-size:22px;font-weight:700;">
            ${p.working_title}
          </div>

          <div style="margin-top:6px;color:#888;">
            ${p.project_code}
          </div>

          <textarea readonly>${p.master_prompt || ""}</textarea>

        </div>
      `).join("");
    }

    function renderQC(qc){

      const el = document.getElementById("qc");

      el.innerHTML = qc.map(q => `
        <div class="score">

          <div class="score-title">
            ${q.working_title}
          </div>

          <div class="score-value ${
            q.release_ready ? 'approved' : 'rejected'
          }">
            ${q.replay_value_score}
          </div>

          <div style="margin-top:10px;color:#aaa;">
            Groove: ${q.groove_integrity_score}
          </div>

          <div style="margin-top:6px;color:#aaa;">
            Cinematic: ${q.cinematic_realism_score}
          </div>

          <div style="margin-top:6px;color:#aaa;">
            Character: ${q.character_consistency_score}
          </div>

          <div style="margin-top:14px;font-size:13px;color:#777;">
            ${q.final_decision}
          </div>

        </div>
      `).join("");
    }

    loadDashboard();

  </script>

</body>
</html>
